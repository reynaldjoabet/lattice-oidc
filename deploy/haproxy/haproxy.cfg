# HAProxy in front of Lattice: TLS (HTTP/1.1, HTTP/2 and HTTP/3), mutual TLS for OAuth client
# authentication, per-client limits, health checks and graceful reloads. Written for HAProxy 3.2 or
# newer. See deploy/haproxy/README.md for the settings Lattice needs to match.
#
# Check it before (re)loading:   haproxy -c -f haproxy.cfg
# Reload without dropping connections: systemctl reload haproxy (or send SIGUSR2 to the master).
#
# Paths come from the environment, with these defaults (presetenv keeps a value already set):
#   LATTICE_CERTS     directory of PEM files (certificate, chain and key in one file per name)
#   LATTICE_CLIENT_CA PEM file of the CAs whose client certificates the mTLS port asks for
#   HAPROXY_RUN       directory for the admin socket

global
    presetenv LATTICE_CERTS     /etc/haproxy/certs
    presetenv LATTICE_CLIENT_CA /etc/haproxy/client-ca.pem
    presetenv HAPROXY_RUN       /run/haproxy

    # Logs go to stdout (a container, or the file a service manager points stdout at). Use a
    # syslog address instead (log 127.0.0.1:514 local0) to ship them elsewhere.
    log stdout format raw local0 info

    maxconn 50000
    # Threads: left to HAProxy, which uses every CPU it may run on.

    # In-flight requests get this long to finish on a reload or shutdown, then their connections
    # are closed.
    hard-stop-after 30s

    # Runtime API (enable/disable servers, read stick tables) for root only, never over the network.
    stats socket "${HAPROXY_RUN}/admin.sock" mode 600 level admin expose-fd listeners
    stats timeout 30s

    # TLS for clients: the Mozilla "intermediate" profile. TLS 1.2 and 1.3, forward-secret AEAD
    # ciphers only, no session tickets (their keys would allow decrypting recorded traffic).
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-curves X25519:prime256v1:secp384r1
    tune.ssl.default-dh-param 2048

defaults
    mode http
    log global

    # One line per request, like Lattice's own access log: the path WITHOUT its query string
    # (%HP), because OAuth query strings carry authorization codes, state and id_token_hint.
    # Fields: client, frontend, backend/server, timers (request/queue/connect/response/total),
    # status, bytes, termination state, connection counts, queues, request ID, method, path.
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %ID %HM %{+Q}HP"
    option dontlognull
    # Browsers open connections they never use (pre-connect); don't log those as errors.
    option http-ignore-probes

    # Timeouts: long enough for Lattice (an Authlete call allows 10 s), short enough to shed trouble.
    timeout connect          3s
    timeout client           30s
    timeout server           30s
    # A client has this long to send its request headers: stops slow-header (slowloris) attacks.
    timeout http-request     10s
    timeout http-keep-alive  60s
    # With every server at its maxconn, a request waits this long for a free slot, then gets 503.
    timeout queue            10s
    timeout check            3s

    option http-keep-alive
    # Header names with characters outside the HTTP token set are dropped, so nothing behind
    # HAProxy can read two spellings of one header differently.
    option http-restrict-req-hdr-names delete

    # Only a request whose connection to a server failed is sent to another server: it never
    # reached one. A request that did reach one may already have been processed (a sign-in, a
    # code issued), and sending it again could repeat that.
    option redispatch
    retries 3
    retry-on conn-failure

    # Errors HAProxy answers itself (no server, queue full) as JSON, which OAuth clients expect.
    http-error status 429 content-type application/json string '{"error":"too_many_requests","error_description":"Slow down."}'
    http-error status 503 content-type application/json string '{"error":"temporarily_unavailable","error_description":"Try again shortly."}'

# --------------------------------------------------------------------------- HTTP: redirect only

frontend http
    bind :80
    bind [::]:80 v6only

    # Everything moves to HTTPS. 308 keeps the method and body, unlike 301/302.
    http-request redirect scheme https code 308

# -------------------------------------------------------------------------------------- HTTPS

frontend https
    # HTTP/2 and HTTP/1.1 over TCP, HTTP/3 over QUIC (UDP). One PEM per certificate in the
    # directory; HAProxy picks it by SNI.
    bind :443       ssl crt "${LATTICE_CERTS}" alpn h2,http/1.1
    bind [::]:443   ssl crt "${LATTICE_CERTS}" alpn h2,http/1.1 v6only
    bind quic4@:443 ssl crt "${LATTICE_CERTS}" alpn h3
    bind quic6@:443 ssl crt "${LATTICE_CERTS}" alpn h3 v6only
    # Tells browsers HTTP/3 is available on the same port.
    http-response set-header alt-svc 'h3=":443"; ma=86400'

    # --- Per-client limits, by address. Generous, because many users can share one address
    # (offices, mobile carriers); Lattice applies its own, stricter limits to sign-ins and codes.
    # Tracked from the first packet of each connection, so too many open connections are refused
    # before any TLS or HTTP work is done for them.
    stick-table type ipv6 size 1m expire 2m store http_req_rate(10s),conn_cur
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 200 }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 500 }

    # Not public: Prometheus scrapes each Lattice server directly.
    http-request deny deny_status 404 if { path /metrics } || { path_beg /metrics/ }

    # Request size: Lattice's endpoints take small forms and JSON. Bigger bodies are refused here,
    # before they reach a server.
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 1048576 }

    # --- Client certificate headers: deleted from every request on this port, which never asks
    # for a certificate. Otherwise a client could claim any certificate, and with it a client's
    # identity (Lattice trusts these headers when MTLS_TRUST_PROXY_HEADERS is on).
    http-request del-header Client-Cert
    http-request del-header Client-Cert-Chain
    http-request del-header X-Ssl-Cert
    http-request del-header X-Client-Cert
    http-request del-header X-Forwarded-Client-Cert-Pem
    http-request del-header X-Ssl-Cert-Chain- -m beg

    # --- Forwarded headers: replaced, never appended to, so Lattice's logs, audit trail and per-
    # address limits see the real client. Lattice trusts them from this proxy only
    # (play.http.forwarded.trustedProxies).
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request del-header Forwarded

    # --- Request ID: a client's X-Request-ID is kept when Lattice would accept it (so a trace
    # can continue), otherwise HAProxy makes one. Both end up in this log and in Lattice's.
    unique-id-format %[uuid(7)]
    http-request set-var(txn.request_id) req.hdr(x-request-id) if { req.hdr(x-request-id) -m reg ^[A-Za-z0-9._:-]{1,64}$ }
    http-request set-var(txn.request_id) unique-id unless { var(txn.request_id) -m found }
    http-request set-header X-Request-ID %[var(txn.request_id)]

    default_backend lattice

# ------------------------------------------------------------------------- HTTPS, mutual TLS

# OAuth clients that authenticate with a TLS client certificate (RFC 8705: tls_client_auth and
# self_signed_tls_client_auth), and get certificate-bound tokens. A separate port, so browsers on
# the main one are never asked to choose a certificate; Authlete advertises it to clients as the
# mtls_endpoint_aliases in the discovery document.
#
# "verify optional" with every verification error ignored: a client may present a self-signed
# certificate, and Lattice (through Authlete) checks it against the client's registration. The
# CA file only tells clients which certificates to offer.
frontend https-mtls
    bind :8443 ssl crt "${LATTICE_CERTS}" alpn h2,http/1.1 verify optional ca-file "${LATTICE_CLIENT_CA}" ca-ignore-err all crt-ignore-err all
    bind [::]:8443 ssl crt "${LATTICE_CERTS}" alpn h2,http/1.1 verify optional ca-file "${LATTICE_CLIENT_CA}" ca-ignore-err all crt-ignore-err all v6only

    stick-table type ipv6 size 1m expire 2m store http_req_rate(10s),conn_cur
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 200 }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 500 }

    # Only the endpoints a client calls with its certificate.
    acl mtls_endpoint path /api/token /api/par /api/revocation /api/introspection /api/device/authorization /api/backchannel/authentication /api/userinfo
    http-request deny deny_status 404 unless mtls_endpoint

    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 1048576 }

    # Whatever the client sent goes, then the certificate it presented in this TLS connection is
    # added, in the RFC 9440 form Lattice reads (:base64 of the DER:).
    http-request del-header Client-Cert
    http-request del-header Client-Cert-Chain
    http-request del-header X-Ssl-Cert
    http-request del-header X-Client-Cert
    http-request del-header X-Forwarded-Client-Cert-Pem
    http-request del-header X-Ssl-Cert-Chain- -m beg
    http-request set-header Client-Cert :%[ssl_c_der,base64]: if { ssl_c_used }

    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request del-header Forwarded

    unique-id-format %[uuid(7)]
    http-request set-var(txn.request_id) req.hdr(x-request-id) if { req.hdr(x-request-id) -m reg ^[A-Za-z0-9._:-]{1,64}$ }
    http-request set-var(txn.request_id) unique-id unless { var(txn.request_id) -m found }
    http-request set-header X-Request-ID %[var(txn.request_id)]

    default_backend lattice

# ----------------------------------------------------------------------------------- Lattice

backend lattice
    # Fewest open requests: a server busy with slow Argon2 sign-ins gets fewer new ones.
    balance leastconn

    # Reuse connections to the servers across clients. "safe": a client's first request always
    # gets a connection of its own, so a request is never re-sent on one another client used.
    http-reuse safe

    # Liveness, not dependencies: /health/live says the process serves requests. Not /health/ready
    # or observing 5xx answers: during an Authlete outage every server answers 503, and taking
    # them all out would replace Lattice's "temporarily unavailable" page with HAProxy's.
    option httpchk
    http-check send meth GET uri /health/live ver HTTP/1.1 hdr Host localhost
    http-check expect status 200

    # check:     out after 2 failed checks (about 2 s), back after 3 good ones.
    # slowstart: a server that has just started or come back gets a growing share over 30 s,
    #            because a cold JVM is slow until its code is compiled.
    # maxconn:   at most this many requests at once per server; more wait in HAProxy's queue
    #            instead of piling onto Lattice's threads.
    default-server check inter 2s fastinter 500ms downinter 5s fall 2 rise 3 slowstart 30s maxconn 500

    # One line per Lattice server. Plain HTTP on a private network; add "ssl verify required
    # ca-file ..." if the network between HAProxy and Lattice isn't trusted.
    server lattice1 10.0.1.11:9000
    server lattice2 10.0.1.12:9000

# ------------------------------------------------------------------------------- monitoring

# HAProxy's own metrics (requests, errors, queue, server states) for Prometheus, and the stats
# page. Loopback only: put it behind your monitoring network, never on a public address.
frontend monitoring
    bind 127.0.0.1:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    # Scrapes every few seconds would fill the log.
    http-request set-log-level silent
