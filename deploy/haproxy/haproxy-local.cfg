# HAProxy in front of a local Lattice, over plain HTTP: no certificates, no HTTPS. For a development
# machine (it listens on 127.0.0.1 only). For production, use haproxy.cfg.
#
# On macOS with Homebrew:
#   cp deploy/haproxy/haproxy-local.cfg /opt/homebrew/etc/haproxy.cfg
#   haproxy -c -f /opt/homebrew/etc/haproxy.cfg
#   brew services restart haproxy
# Then open http://localhost:9080, with Lattice running on port 9000 (sbt --client run).
# Logs: /opt/homebrew/var/log/haproxy.log. Metrics and stats: http://127.0.0.1:8404/stats

global
    # Logs go to stdout, which the Homebrew service writes to /opt/homebrew/var/log/haproxy.log.
    log stdout format raw local0 info

    maxconn 10000
    # In-flight requests get this long to finish on a reload or shutdown.
    hard-stop-after 30s

    # Runtime API (enable/disable servers, read stick tables): this user only.
    stats socket /opt/homebrew/var/run/haproxy.sock mode 600 level admin
    stats timeout 30s

defaults
    mode http
    log global

    # One line per request: the path WITHOUT its query string (%HP), because OAuth query strings
    # carry authorization codes, state and id_token_hint.
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %ID %HM %{+Q}HP"
    option dontlognull
    option http-ignore-probes

    # Timeouts: long enough for Lattice (an Authlete call allows 10 s).
    timeout connect          3s
    timeout client           30s
    timeout server           30s
    timeout http-request     10s
    timeout http-keep-alive  60s
    timeout queue            10s
    timeout check            3s

    option http-keep-alive
    option http-restrict-req-hdr-names delete

    # Only a request whose connection to Lattice failed is retried: it never reached Lattice.
    option redispatch
    retries 3
    retry-on conn-failure

    # Errors HAProxy answers itself as JSON, which OAuth clients expect. A 503 usually means
    # Lattice isn't running on port 9000.
    http-error status 429 content-type application/json string '{"error":"too_many_requests","error_description":"Slow down."}'
    http-error status 503 content-type application/json string '{"error":"temporarily_unavailable","error_description":"Lattice is not running on port 9000."}'

frontend web
    bind 127.0.0.1:9080

    # Per-client limits, as in production.
    stick-table type ipv6 size 100k expire 2m store http_req_rate(10s),conn_cur
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 200 }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 500 }

    http-request deny deny_status 404 if { path /metrics } || { path_beg /metrics/ }
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 1048576 }

    # Client certificate headers never get through: with MTLS_TRUST_PROXY_HEADERS on, Lattice would
    # otherwise believe a certificate the client made up.
    http-request del-header Client-Cert
    http-request del-header Client-Cert-Chain
    http-request del-header X-Ssl-Cert
    http-request del-header X-Client-Cert
    http-request del-header X-Forwarded-Client-Cert-Pem
    http-request del-header X-Ssl-Cert-Chain- -m beg

    # Forwarded headers: replaced, never appended to. Lattice trusts them from 127.0.0.1, which is
    # Play's default for "sbt run" (with production.conf, add 127.0.0.1 to trustedProxies).
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    http-request del-header Forwarded

    # Request ID: a client's X-Request-ID is kept when Lattice would accept it, otherwise HAProxy
    # makes one. The same ID appears in this log and in Lattice's.
    unique-id-format %[uuid(7)]
    http-request set-var(txn.request_id) req.hdr(x-request-id) if { req.hdr(x-request-id) -m reg ^[A-Za-z0-9._:-]{1,64}$ }
    http-request set-var(txn.request_id) unique-id unless { var(txn.request_id) -m found }
    http-request set-header X-Request-ID %[var(txn.request_id)]

    default_backend lattice

backend lattice
    balance leastconn
    http-reuse safe

    # Liveness: Lattice is marked down after 2 failed checks, and back after 1 good one.
    option httpchk
    http-check send meth GET uri /health/live ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server check inter 2s fall 2 rise 1 maxconn 500

    # Add a line per extra Lattice server (sbt run on another port, or a Docker container).
    server lattice1 127.0.0.1:9000

frontend monitoring
    bind 127.0.0.1:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    http-request set-log-level silent
