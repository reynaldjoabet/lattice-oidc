global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: lattice
    metrics_path: /metrics
    # lattice.metrics.token: the same METRICS_TOKEN, given to this container as a Compose secret.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["lattice:9000"]
