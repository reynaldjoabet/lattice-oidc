apiVersion: apps/v1
kind: Deployment
metadata:
  name: lattice
spec:
  replicas: 3 # the HorizontalPodAutoscaler takes over from here
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never below the current capacity during a rollout.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: lattice
      automountServiceAccountToken: false
      enableServiceLinks: false
      # preStop (10 s) plus Play's coordinated shutdown, which drains in-flight requests.
      terminationGracePeriodSeconds: 60
      # Stronger isolation, where the nodes support it (user namespaces: on by default since
      # Kubernetes 1.33, GA in 1.36; also needs a container runtime and kernel with ID-mapped
      # mounts): UID 1001 in the pod maps to an unprivileged UID on the node, so a container escape
      # has no rights there. Pods fail to start on nodes without support.
      # hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # the image's USER 1001:0, which owns the app's read-only files
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # At most one replica more on any node than on another, so a node failure takes few.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: server
          matchLabelKeys:
            - pod-template-hash
        # Spread over zones when the cluster has them.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: server
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: lattice
          image: lattice-oidc # set by the overlay's `images`
          imagePullPolicy: IfNotPresent
          # If the container exits before writing a termination message (a startup error such as a
          # missing setting), show the end of its log in `kubectl describe pod`.
          terminationMessagePolicy: FallbackToLogsOnError
          # Arguments to the start script: load the production overrides.
          args:
            - -Dconfig.file=/etc/lattice/production.conf
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lattice-env # non-secret settings, from the overlay
            - secretRef:
                name: lattice-secrets # from the overlay
          # In-place resizing (Kubernetes 1.35+). The JVM sizes its heap from the memory limit at
          # startup, so a new memory size only takes effect after a restart; CPU applies live.
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # The heap is 75% of this (MaxRAMPercentage, in the image's JAVA_OPTS). No CPU
              # limit: throttling a JVM stalls its GC and request threads; requests reserve CPU.
              memory: 1Gi
          # The JVM, Flyway's migrations and Play's startup can take a while: liveness waits.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36 # 3 minutes
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Ready once the app has started. Deliberately not tied to Authlete or the database: they
          # are shared, so an outage would take every replica out of the Service at once and users
          # would get the gateway's error instead of Lattice's "temporarily unavailable" page.
          # Watch lattice_dependency_up (or /health/dependencies) for those instead.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Keep serving while the endpoint removal reaches the Service and the gateway, so
            # no request is sent to a pod that is already shutting down.
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/lattice
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: lattice-config
        # Play's temporary files (uploads); everything else is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
