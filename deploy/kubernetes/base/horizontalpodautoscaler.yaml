apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lattice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lattice
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # Measured against the CPU request (500m).
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale up quickly, down slowly: a new JVM takes time to warm up.
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
