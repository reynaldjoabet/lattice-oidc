<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="lattice-oidc">
  <!-- Concept B: a square lattice; the centre atom (identity) is bonded to everything around it -->
  <rect width="64" height="64" rx="14" fill="#3b5bdb"/>
  <g stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round">
    <path d="M16 16H48M16 32H48M16 48H48M16 16V48M32 16V48M48 16V48"/>
  </g>
  <g fill="#fff">
    <circle cx="16" cy="16" r="4"/><circle cx="32" cy="16" r="4"/><circle cx="48" cy="16" r="4"/>
    <circle cx="16" cy="32" r="4"/><circle cx="48" cy="32" r="4"/>
    <circle cx="16" cy="48" r="4"/><circle cx="32" cy="48" r="4"/><circle cx="48" cy="48" r="4"/>
  </g>
  <circle cx="32" cy="32" r="7.5" fill="#ffb547" stroke="#fff" stroke-width="2.5"/>
</svg>
