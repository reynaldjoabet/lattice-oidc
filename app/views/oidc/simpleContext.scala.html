@*
 * A context panel with a heading and one line: for pages that aren't part of an app's sign-in,
 * such as connecting a device or approving a sign-in started on another screen.
 *@
@(eyebrow: String, lead: String)
<div class="ctx-block">
  <span class="eyebrow">@eyebrow</span>
  <p class="ctx-lead">@lead</p>
</div>
