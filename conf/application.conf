# This is the main configuration file for the application.
# https://www.playframework.com/documentation/latest/ConfigFile

play.modules.enabled += "com.lattice.oidc.modules.AuthleteModule"

# JSON errors for protocol endpoints, HTML for browser pages; never stack traces.
play.http.errorHandler = "com.lattice.oidc.common.ErrorHandler"

# Signing key for Play's session/flash cookies. Production refuses to start without it; dev and
# test fall back to Play's generated development secret.
play.http.secret.key = ${?APPLICATION_SECRET}

# Global WS connect timeout. Play WS does not support per-request connect timeouts, so this
# applies to the Authlete client as well.
play.ws.timeout.connection = 5 seconds
play.ws.timeout.connection = ${?AUTHLETE_CONNECT_TIMEOUT}

authlete {
  # Only the V3 API is supported (service-scoped paths, bearer/DPoP access tokens).
  base-url = "https://us.authlete.com"
  base-url = ${?AUTHLETE_BASE_URL}

  # Numeric service ID and the service access token from the Authlete console.
  service-id = ""
  service-id = ${?AUTHLETE_SERVICE_APIKEY}
  service-access-token = ""
  service-access-token = ${?AUTHLETE_SERVICE_ACCESSTOKEN}

  # Optional private JWK (JSON, with "alg") for DPoP-bound access tokens.
  dpop-key = ""
  dpop-key = ${?AUTHLETE_DPOP_KEY}

  # Upper bound for a single Authlete HTTP call.
  read-timeout = 10 seconds
  read-timeout = ${?AUTHLETE_READ_TIMEOUT}
}

# Thread pool for blocking Authlete calls; keeps them off Play's default dispatcher.
authlete-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 32
    fixed-pool-size = ${?AUTHLETE_DISPATCHER_THREADS}
  }
  throughput = 1
}

# ---------------------------------------------------------------------------------------------
# Lattice OIDC server
# ---------------------------------------------------------------------------------------------
lattice {
  # Externally visible base URL (scheme://host[:port]) when running behind a proxy. Used to
  # compute request URLs (e.g. DPoP htu) instead of trusting X-Forwarded-* headers.
  public-base-url = ""
  public-base-url = ${?PUBLIC_BASE_URL}

  # Trust TLS client certificates forwarded by a reverse proxy (X-Ssl-Cert*, Client-Cert).
  # Enable ONLY when the proxy strips these headers from incoming requests.
  mtls.trust-proxy-headers = false
  mtls.trust-proxy-headers = ${?MTLS_TRUST_PROXY_HEADERS}

  # HMAC key for pairwise subject identifiers (OIDC Core 8.1). Changing it changes every
  # pairwise "sub", so set it once per deployment. Falls back to play.http.secret.key.
  pairwise-secret = ""
  pairwise-secret = ${?PAIRWISE_SECRET}

  # Seed the in-memory user store with the demo accounts (john, jane, max, inga).
  demo-users = true
  demo-users = ${?DEMO_USERS}

  # /api/test/* diagnostic endpoints.
  test-endpoints.enabled = false
  test-endpoints.enabled = ${?TEST_ENDPOINTS_ENABLED}

  # Raw JSON served at /.well-known/apple-app-site-association (404 when empty).
  apple-app-site-association = ""
  apple-app-site-association = ${?APPLE_APP_SITE_ASSOCIATION}

  session {
    # Lifetime of a pending authorization / device / federation interaction.
    interaction-ttl = 10 minutes
    # Maximum lifetime of a login session (also bounds native SSO device secrets).
    max-lifespan = 10 hours
  }

  login {
    max-failures = 5
    lockout = 15 minutes
    # ACR values satisfied by this server's password login. A requested ACR is only asserted when
    # it is listed here; essential ACR requests otherwise fail with ACR_NOT_SATISFIED.
    satisfied-acrs = []
  }

  # Issuers whose JWTs are accepted as JWT bearer assertions (RFC 7523) and token exchange
  # subject tokens (RFC 8693). Tokens issued by this server itself are always accepted.
  #   trusted-jwt-issuers = [ { issuer = "https://idp.example.com", jwks-uri = "https://idp.example.com/jwks" } ]
  trusted-jwt-issuers = []

  # Resource servers allowed to call the introspection endpoint (HTTP Basic: id / secret).
  # Optional for JWT introspection responses (RFC 9701): introspection-sign-alg,
  # introspection-encryption-alg, introspection-encryption-enc, shared-key-for-sign,
  # shared-key-for-encryption, public-key-for-encryption (JWK).
  resource-servers = [
    {
      id = "rs0"
      secret = "rs0-secret"
      secret = ${?RS0_SECRET}
      uri = "https://rs0.example.com"
    }
  ]

  ciba {
    # How the authentication device (CIBA simulator) is driven: sync | async | poll
    mode = "sync"
    mode = ${?CIBA_AD_MODE}
    base-url = "https://cibasim.authlete.com"
    base-url = ${?CIBA_AD_BASE_URL}
    workspace = ""
    workspace = ${?CIBA_AD_WORKSPACE}
    # Fraction of the auth_req_id lifetime given to the user on the device.
    auth-timeout-ratio = 0.8
    request-timeout = 10 seconds
    poll-interval = 5 seconds
    poll-max-count = 10
    notification-timeout = 10 seconds
  }

  identity-providers {
    # Identity brokering: JSON file listing upstream OpenID Providers end-users can sign in with
    # ({"identityProviders": [...]}; java-oauth-server federations.json files also work).
    # FEDERATIONS_FILE is still accepted.
    file = ""
    file = ${?FEDERATIONS_FILE}
    file = ${?IDENTITY_PROVIDERS_FILE}
  }

  vci {
    credential-offer-endpoint = "openid-credential-offer://"
  }

  obb {
    enabled = true
    enabled = ${?OBB_ENABLED}
    # PEM files with the Open Banking Brasil root certificates used to validate client certs.
    root-certificates = []
    directory-jwks-uri = ""
    directory-jwks-uri = ${?OBB_DIRECTORY_JWKS_URI}
  }

  logout {
    backchannel-timeout = 5 seconds
  }

  ui {
    # Branding of the end-user pages (sign-in, consent, device, logout).
    brand-name = "Lattice"
    brand-name = ${?UI_BRAND_NAME}
    # Footer links; each is shown only when set.
    privacy-url = ""
    privacy-url = ${?UI_PRIVACY_URL}
    terms-url = ""
    terms-url = ${?UI_TERMS_URL}
    help-url = ""
    help-url = ${?UI_HELP_URL}
  }

  security {
    # HTTP Strict Transport Security; enable when the server is reachable over HTTPS only.
    hsts.enabled = false
    hsts.enabled = ${?HSTS_ENABLED}
    hsts.max-age = 365 days
  }
}

# ---------------------------------------------------------------------------------------------
# In-process caches (Caffeine through Play's cache API)
# ---------------------------------------------------------------------------------------------
# One cache per kind of state, so that a flood of one kind (e.g. unauthenticated authorization
# requests or logins with random usernames) can only evict entries of that kind and never
# legitimate login sessions. Entries also expire individually with the TTL they are stored with.
# Sizes are entry counts; memory estimates assume ~1 KB per entry. All values are per node.
play.cache {
  bindCaches = [
    "lattice-sessions",
    "lattice-interactions",
    "lattice-login-failures",
    "lattice-device-secrets",
    "lattice-ciba",
    "lattice-obb-consents"
  ]

  caffeine {
    defaults {
      # Statistics (hit/miss/eviction counts) are cheap and needed to size caches in production.
      record-stats = true
    }

    caches {
      # Login sessions (one per logged-in browser). Size for peak concurrent users; an evicted
      # session simply logs that user out. ~100 MB at the maximum.
      lattice-sessions {
        initial-capacity = 1024
        maximum-size = 100000
        maximum-size = ${?CACHE_SESSIONS_MAX}
      }
      # Pending consent, device and identity-brokering flows (lattice.session.interaction-ttl).
      # Created by unauthenticated requests, so kept separate and bounded.
      lattice-interactions {
        initial-capacity = 1024
        maximum-size = 50000
        maximum-size = ${?CACHE_INTERACTIONS_MAX}
      }
      # Failed-login counters for account lockout (lattice.login.lockout). Tiny entries; large so
      # that a flood of random usernames cannot push out the counters of attacked accounts.
      lattice-login-failures {
        initial-capacity = 1024
        maximum-size = 200000
        maximum-size = ${?CACHE_LOGIN_FAILURES_MAX}
      }
      # Native SSO device secrets, bound to login sessions.
      lattice-device-secrets {
        maximum-size = 100000
        maximum-size = ${?CACHE_DEVICE_SECRETS_MAX}
      }
      # CIBA requests awaiting the authentication device's asynchronous callback.
      lattice-ciba {
        maximum-size = 10000
        maximum-size = ${?CACHE_CIBA_MAX}
      }
      # Open Banking Brasil consents. NOTE: consents are durable business data; a cache is only
      # suitable for single-node/demo deployments. Eviction here loses a consent.
      lattice-obb-consents {
        maximum-size = 100000
        maximum-size = ${?CACHE_OBB_CONSENTS_MAX}
      }
    }
  }
}

play.http.session {
  httpOnly = true
  sameSite = "lax"
  secure = false
  secure = ${?SESSION_COOKIE_SECURE}
}

play.filters {
  # Explicit filter order (outermost first). Request ids and the access log come first so that
  # every request is logged with an id, including those rejected by the security filters below.
  enabled = [
    "com.lattice.oidc.filters.RequestIdFilter",
    "com.lattice.oidc.filters.UiFilter",
    "com.lattice.oidc.filters.AccessLogFilter",
    "com.lattice.oidc.filters.HstsFilter",
    "play.filters.hosts.AllowedHostsFilter",
    "play.filters.headers.SecurityHeadersFilter",
    "play.filters.csrf.CSRFFilter"
  ]
  hosts.allowed = ["localhost", "127.0.0.1", ${?ALLOWED_HOST}]
  headers {
    contentSecurityPolicy = "default-src 'self'; img-src 'self' https: data:; style-src 'self'; frame-ancestors 'none'"
    # Lets the form_post response carry its own CSP for the auto-submit script.
    allowActionSpecificHeaders = true
  }
}
